name: CI

# Every check that protects this app runs here, on every push and pull request.
#
# WHY THIS EXISTS AND WHY IT IS FIRST
#   Before this file, `npm test`, lint, typecheck, build and the Postgres harness
#   all passed locally and nothing ran them on a push. The auth and money
#   migrations that follow in the remediation plan are exactly the changes that
#   need a repeatable gate in front of them, so this lands before any of them.
#
#   The database job matters most. supabase/tests/run.sh also runs on the
#   developer machine now (Docker works there, confirmed 29 Sep 2026), but this
#   is the gate that no pull request can skip: every migration is replayed here
#   before it merges.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # The build needs the public Supabase env vars to exist, but never needs
      # them to be real: nothing in the build talks to Supabase. Placeholders
      # keep the build honest without putting a live key in CI.
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_SITE_URL: https://placeholder.invalid
        run: npm run build

  database:
    name: Migration replay and Postgres assertions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The harness starts its own postgres:17 container on port 55432 and talks
      # to it with psql, so the runner needs the client but not a service.
      - name: Install the Postgres client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Run the Postgres harness
        run: npm run test:db

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    # Blocking since the backlog was cleared on 29 Sep 2026 (Next.js 16.1.4 to
    # 16.3.7, which closed a critical unauthenticated RCE in the image
    # optimiser). A new high or critical advisory in a production dependency
    # now fails CI, including on pull requests that did not touch dependencies:
    # that is deliberate, because the fix is urgent whichever change finds it.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --audit-level=high --omit=dev
